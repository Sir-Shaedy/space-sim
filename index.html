let inspectedKey = null;

function detectLoreKeyFromText(txt) {
  const t = (txt || "").toLowerCase();
  if (t.startsWith("sun")) return "sun";
  if (t.startsWith("earth")) return "earth";
  if (t.startsWith("moon")) return "moon";
  if (t.includes("0° node")) return "node";
  if (t.startsWith("mercury")) return "mercury";
  if (t.startsWith("venus")) return "venus";
  if (t.startsWith("mars")) return "mars";
  if (t.includes("asteroid") || t.includes("ceres")) return "asteroid";
  if (t.startsWith("jupiter")) return "jupiter";
  if (t.startsWith("saturn")) return "saturn";
  if (t.startsWith("uranus")) return "uranus";
  if (t.startsWith("neptune")) return "neptune";
  if (t.includes("kuiper") || t.includes("pluto")) return "kuiper";
  if (t.startsWith("probe")) return "probe";
  if (t.includes("geo belt")) return "geo";
  if (t.startsWith("iss")) return "iss";
  if (t.includes("jwst")) return "jwst";
  return null;
}

function project3DToScreen(pos, view, proj) {
  const x = pos[0], y = pos[1], z = pos[2];
  const vx = view[0]*x + view[4]*y + view[8]*z + view[12];
  const vy = view[1]*x + view[5]*y + view[9]*z + view[13];
  const vz = view[2]*x + view[6]*y + view[10]*z + view[14];
  const vw = view[3]*x + view[7]*y + view[11]*z + view[15];
  const cx = proj[0]*vx + proj[4]*vy + proj[8]*vz + proj[12]*vw;
  const cy = proj[1]*vx + proj[5]*vy + proj[9]*vz + proj[13]*vw;
  const cw = proj[3]*vx + proj[7]*vy + proj[11]*vz + proj[15]*vw;
  if (cw <= 0.1) return null;
  const nx = cx / cw, ny = cy / cw;
  if (nx < -1.1 || nx > 1.1 || ny < -1.1 || ny > 1.1) return null;
  return {
    x: (nx * 0.5 + 0.5) * window.innerWidth,
    y: (0.5 - ny * 0.5) * window.innerHeight
  };
}

let lastScreenTargets = [];

function updateFloatingLabels(view, proj, items) {
  const layer = document.getElementById("labels-layer");
  lastScreenTargets = [];
  for (const it of items) {
    const p = project3DToScreen(it.pos, view, proj);
    const key = it.key || detectLoreKeyFromText(it.text);
    if (p && key) lastScreenTargets.push({ x: p.x, y: p.y, key });
  }
  if (!showLabels || (activeTab !== "orbit" && !activeEvent && !specialMode)) {
    layer.innerHTML = "";
    return;
  }
  let html = "";
  for (const it of items) {
    const p = project3DToScreen(it.pos, view, proj);
    if (!p) continue;
    const key = it.key || detectLoreKeyFromText(it.text);
    const clickAttr = key ? `onclick="event.stopPropagation();openObjectInspector('${key}')"` : "";
    html += `<div class="lbl-3d ${it.cls || ''}" ${clickAttr} style="left:${p.x.toFixed(1)}px;top:${(p.y - (it.yOff || 16)).toFixed(1)}px;">${it.text}</div>`;
  }
  layer.innerHTML = html;
}

const SPEED_STEPS = [
  { val: 1, label: "1x" },
  { val: 86400, label: "1d/s" },
  { val: 604800, label: "1w/s" },
  { val: 2592000, label: "1mo/s" },
  { val: 15552000, label: "6mo/s" },

];
let lastNonZeroSpeed = 1;

function toggleTargetSheet(forceClose) {
  const sheet = document.getElementById("target-sheet");
  const pill = document.getElementById("target-pill-btn");

function focusBody(id) {
  focusMode = id;
  document.querySelectorAll("#target-sheet .bento-item").forEach((el) => el.classList.toggle("active", el.id === "pl-" + id));
  const names = {
    sun: "Sun", mercury: "Mercury", venus: "Venus", earth: "Earth", mars: "Mars",
    asteroid: "Asteroid Belt", jupiter: "Jupiter", saturn: "Saturn",
    uranus: "Uranus", neptune: "Neptune", pluto: "Pluto", kuiper: "Kuiper Belt"
  };
  setTargetLabel(names[id] || "Earth");
  toggleTargetSheet(true);

  if (id === "sun") { targetDist = 14; targetPitch = 0.35; }
  else if (id === "earth") { targetDist = 11.2; targetPitch = 0.34; }
  else if (id === "asteroid") { focusMode = "asteroid"; targetDist = 165; targetPitch = 0.72; }
  else if (id === "kuiper") { focusMode = "kuiper"; targetDist = 1180; targetPitch = 0.58; }
  else if (id === "jupiter") { targetDist = 26; targetPitch = 0.32; }
  else {
    const pl = SOLAR_PLANETS.find((p) => p.id === id);
    targetDist = pl ? Math.max(4.5, pl.r * 5.2) : 12;
    targetPitch = 0.28;
  }
}

function setCameraPreset(mode) {
  cameraPreset = mode;
  document.querySelectorAll("#target-sheet .bento-item").forEach((el) => {
    if (el.id.startsWith("cam-")) el.classList.toggle("active", el.id === "cam-" + mode);
  });
  toggleTargetSheet(true);
  if (mode === "solar") { focusMode = "solar"; setTargetLabel("Solar System"); targetDist = 110; targetPitch = 0.58; }
  else if (mode === "earth") { focusBody("earth"); return; }
  else { focusMode = "earth"; setTargetLabel("Earth (0°)"); targetDist = 11.2; targetPitch = 0.01; }
}

function setSpeed(s) {
  simSpeed = s;
  if (s > 0) lastNonZeroSpeed = s;
  const ppBtn = document.getElementById("play-pause-btn");
  const spBtn = document.getElementById("speed-cycle-btn");
  if (ppBtn) {
    ppBtn.textContent = s === 0 ? "▶" : "❚❚";
    ppBtn.classList.toggle("active", s === 0);
  }
  if (spBtn) {
    const step = SPEED_STEPS.find((x) => x.val === (s > 0 ? s : lastNonZeroSpeed)) || SPEED_STEPS[0];
    spBtn.textContent = step.label;
    spBtn.classList.toggle("active", s > 0);
  }
}

function togglePlayPause() {
  setSpeed(simSpeed === 0 ? lastNonZeroSpeed : 0);
}

function cycleSpeed() {
  const cur = simSpeed > 0 ? simSpeed : lastNonZeroSpeed;
  const idx = SPEED_STEPS.findIndex((x) => x.val === cur);
  const next = SPEED_STEPS[(idx + 1) % SPEED_STEPS.length];
  setSpeed(next.val);
}

  renderDetailBox();
  document.getElementById("list-view").style.display = "none";
  document.getElementById("detail-view").style.display = "block";

function selectDetailCity(cityId) {
  if (!activeEvent) return;
  let found = activeEvent.states.find((s) => s.id === cityId);
  if (!found) {
    const st = ALL_NG_STATES.find((s) => s.id === cityId);
    if (st) {
      found = computeCityEclipse(activeEvent, st);
      activeEvent.states.push(found);
      activeEvent.states.sort((a, b) => b.cov - a.cov);
    }
  }
  if (found) { selectedCityObj = found; renderDetailBox(); }
}

function useMyGPS() {
  if (!activeEvent || !navigator.geolocation) return;
  const btn = document.getElementById("gps-btn");
  if (btn) btn.textContent = "Locating...";
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const gpsCity = { id: "gps", name: "My GPS Location", lat: pos.coords.latitude, lon: pos.coords.longitude };
      const res = computeCityEclipse(activeEvent, gpsCity);
      activeEvent.states = activeEvent.states.filter((s) => s.id !== "gps");
      activeEvent.states.unshift(res);
      selectedCityObj = res;
      renderDetailBox();
    },
    () => {
      if (btn) { btn.textContent = "GPS Off"; setTimeout(() => { btn.textContent = "Use GPS"; }, 1800); }
    },
    { enableHighAccuracy: false, timeout: 6000 }
  );
}

  const startStr = watTimeShort.format(new Date(c.startMs));
  const peakStr = watTimeShort.format(new Date(c.peakMs));
  const endStr = watTimeShort.format(new Date(c.endMs));
  const emoji = ev.kind === "solar" ? "🌑☀️" : "🌕🩸";
  const text = `${emoji} *${ev.type} — ${ev.date}*\n`
    + `📍 Location: ${c.name}\n`
    + `🔭 Coverage: ${c.pctLabel}\n`
    + `⏰ Starts: ${startStr} WAT\n`
    + `⭐ Peak: ${peakStr} WAT\n`
    + `🏁 Ends: ${endStr} WAT\n`
    + `\n${ev.summary}`;
  if (navigator.share) {
    navigator.share({ title: `${ev.type} (${ev.date})`, text }).catch(() => {});
  } else {
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank");
  }
}

      ? topocentricVec(sp.ra, sp.dec, sp.R * 23454.8, msToJD(c.peakMs), st.lat, st.lon)

function setEventCamera(mode) {
  eventCamMode = mode;
  document.getElementById("ev-side-btn").classList.toggle("active", mode === "side");
  document.getElementById("ev-angle-btn").classList.toggle("active", mode === "angle");
  if (specialMode === "encke" || specialMode === "halley" || (specialMode && specialMode.startsWith("exo_"))) {
    focusMode = "solar";
    if (mode === "side") { targetPitch = 0.02; targetDist = 38; }
    else { targetPitch = 0.55; targetDist = 36; }
    return;
  }
  focusMode = "earth";
  if (mode === "side") { targetYaw = Math.PI * 0.5; targetPitch = 0.01; targetDist = 10.5; }
  else { targetYaw = (activeEvent && activeEvent.kind === "solar") ? -0.95 : 1.15; targetPitch = 0.30; targetDist = 9.4; }

function toggleEventPlay() {
  eventPlaying = !eventPlaying;
  document.getElementById("ev-play-btn").textContent = eventPlaying ? "Pause" : "Play";
}

function onScrub(val) {

}

// ==================== STATE-SPECIFIC SKY INSET ====================
const skyCanvas = document.getElementById("sky");
const skyCtx = skyCanvas.getContext("2d");

function drawNigeriaSky(ev, cityObj, progress) {
  const w = 192, h = 192, cx = 96, cy = 96, r = 46;
  skyCtx.clearRect(0, 0, w, h);

  const peakNorm = 0.5;
  const distFromPeak = Math.min(1, Math.abs(progress - peakNorm) / 0.5);
  const peakFactor = Math.max(0, Math.pow(1 - distFromPeak, 1.5));
  const currentCover = Math.round(cityObj.pctNum * peakFactor);
  document.getElementById("sky-pct").textContent = currentCover + "%";

  if (ev.kind === "solar") {
    const dark = (currentCover / 100) * 0.90;
    skyCtx.fillStyle = `rgb(${Math.round(28*(1-dark))}, ${Math.round(78*(1-dark))}, ${Math.round(145*(1-dark))})`;
    skyCtx.fillRect(0, 0, w, h);

    if (currentCover > 88) {
      const grad = skyCtx.createRadialGradient(cx, cy, r * 0.88, cx, cy, r * 1.75);
      grad.addColorStop(0, "rgba(255, 248, 220, 0.75)");
      grad.addColorStop(1, "rgba(255, 248, 220, 0)");
      skyCtx.fillStyle = grad;
      skyCtx.beginPath(); skyCtx.arc(cx, cy, r * 1.75, 0, Math.PI * 2); skyCtx.fill();
    }

    skyCtx.fillStyle = "#fde047";
    skyCtx.beginPath(); skyCtx.arc(cx, cy, r, 0, Math.PI * 2); skyCtx.fill();

    // True apogee/perigee Moon-to-Sun ratio
    const moonR = r * Math.max(0.92, Math.min(1.05, cityObj.moonRatio || 0.99));
    const minSep = (1 - cityObj.pctNum / 100) * (r * 1.85);
    const dx = (progress - peakNorm) * (r * 4.2);
    skyCtx.fillStyle = "#060911";
    skyCtx.beginPath(); skyCtx.arc(cx + dx, cy - minSep, moonR, 0, Math.PI * 2); skyCtx.fill();
  } else {
    skyCtx.fillStyle = "#060911"; skyCtx.fillRect(0, 0, w, h);
    const umbraR = r * 1.55;
    const moonDx = (progress - peakNorm) * (r * 4.4);
    const moonDy = -(ev.tiltDeg / 1.02) * (umbraR * 0.92);

    skyCtx.save();
    skyCtx.beginPath(); skyCtx.arc(cx, cy, umbraR, 0, Math.PI * 2);
    skyCtx.strokeStyle = "rgba(248, 113, 113, 0.25)";
    skyCtx.setLineDash([4, 4]); skyCtx.stroke(); skyCtx.restore();

    const mx = cx + moonDx, my = cy + moonDy;
    skyCtx.fillStyle = "#e2e8f0";
    skyCtx.beginPath(); skyCtx.arc(mx, my, r * 0.68, 0, Math.PI * 2); skyCtx.fill();

    skyCtx.save();
    skyCtx.beginPath(); skyCtx.arc(mx, my, r * 0.68, 0, Math.PI * 2); skyCtx.clip();
    skyCtx.fillStyle = "rgba(153, 27, 27, 0.88)";
    skyCtx.beginPath(); skyCtx.arc(cx, cy, umbraR, 0, Math.PI * 2); skyCtx.fill();
    skyCtx.restore();
  }
}

// ==================== MAIN RENDER LOOP ====================
function render(now) {
  const dt = Math.min((now - lastFrameMs) / 1000, 0.1);
  lastFrameMs = now;

  if (!activeEvent && (!specialMode || specialMode === "slingshot")) {
    simTimeMs += dt * 1000 * simSpeed;
    const d = new Date(simTimeMs);
    document.getElementById("hud-date").textContent = watDateShort.format(d);
    document.getElementById("hud-time").textContent = watTimeSec.format(d) + " WAT";
  } else if (eventPlaying) {
    eventProgress += dt * (specialMode ? 0.11 : 0.11);
    if (eventProgress >= 1.0) eventProgress = 0.0;
    const sl = document.getElementById("ev-slider");
    if (sl) sl.value = String(Math.round(eventProgress * 1000));
  }

  camYaw += (targetYaw - camYaw) * 0.12;
  camPitch += (targetPitch - camPitch) * 0.12;
  camDist += (targetDist - camDist) * 0.12;

  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.clearColor(0.016, 0.024, 0.048, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  const earthOrbitR = 20.0;
  const tiltRad = 5.14 * RAD;

  let earthAngle, moonAngle, moonOrbitR = 4.3, moonYOffset = 0, earthSpin, nodeAngle = 0;
  let tideStrength = 0.5;
  if (!activeEvent && (!specialMode || specialMode === "slingshot")) {
    // True J2000 astronomical positions
    const jd = msToJD(simTimeMs);
    const sp = sunPos(jd);
    const mp = moonPos(jd);
    earthAngle = (sp.lon + 180) * RAD;
    moonAngle = mp.lon * RAD;
    nodeAngle = mp.Om * RAD;
    moonOrbitR = 4.3 * (mp.distKm / 385000);
    moonYOffset = Math.sin(mp.lat * RAD) * moonOrbitR;
    const utcFrac = ((simTimeMs % 86400000) + 86400000) % 86400000 / 86400000;
    earthSpin = -earthAngle + (utcFrac - 0.5) * Math.PI * 2;
    // Spring vs Neap Tide factor: |cos(moonLon - sunLon)| -> 1 at New/Full Moon (Spring), 0 at Quarter (Neap)
    tideStrength = Math.pow(Math.cos((mp.lon - sp.lon) * RAD), 2);
  } else if (activeEvent) {
    earthAngle = 0;
    const curMs = selectedCityObj.startMs + eventProgress * (selectedCityObj.endMs - selectedCityObj.startMs);
    const peakNorm = (selectedCityObj.peakMs - selectedCityObj.startMs) / Math.max(1, selectedCityObj.endMs - selectedCityObj.startMs);
    // Full symmetric transit from -1.0 (entering outside) -> 0.0 (peak obstruction) -> +1.0 (exited past far side)
    const rel = (eventProgress - 0.5) * 2.0;
    moonOrbitR = 4.3 * (activeEvent.moonDistKm / 385000);

    const cityMeta = ALL_NG_STATES.find((s) => s.id === selectedCityObj.id) || { lat: 9.06, lon: 7.49 };
    const latRad = (cityMeta.lat || 9.0) * RAD;

    if (activeEvent.kind === "solar") {
      // Position Earth so the selected city faces the Sun (-X) near mid-transit
      earthSpin = (cityMeta.lon || 7.5) * RAD - 0.14 + rel * 0.22;
      // Sweep Moon from outside on the left (pi - 0.95) across the Sun-Earth line (pi) to outside on the right (pi + 0.95)
      moonAngle = Math.PI + rel * 0.95;
      // Y height aligned to the selected city's latitude on Earth's sphere
      moonYOffset = Math.sin(latRad) * 1.12;
    } else {
      earthSpin = Math.PI - 0.14 + rel * 0.26;
      moonAngle = rel * 1.35;
      const signLat = activeEvent.tiltDeg >= 0 ? 1 : -1;
      moonYOffset = signLat * (activeEvent.tiltDeg / 1.02) * 0.85;
    }

    const curTimeStr = watTimeShort.format(new Date(curMs));
    const liveTiltDeg = Math.abs(activeEvent.tiltDeg + rel * 0.28);
    document.getElementById("ev-live-time").textContent = `${activeEvent.date} • ${curTimeStr} WAT`;
    document.getElementById("ev-live-tilt").textContent = `Moon Tilt: ${liveTiltDeg.toFixed(2)}° from 0° • ${activeEvent.moonDistKm.toLocaleString()} km`;
    document.getElementById("ev-t-cur").textContent = curTimeStr;
    drawNigeriaSky(activeEvent, selectedCityObj, eventProgress);
  } else if (specialMode === "apophis") {
    // April 13, 2029, 21:46 UTC (10:46 PM WAT) closest approach over West Africa/Atlantic
    earthAngle = 0;
    const startMs = Date.UTC(2029, 3, 13, 19, 0, 0); // 8:00 PM WAT
    const endMs   = Date.UTC(2029, 3, 14, 0, 30, 0); // 1:30 AM WAT
    const curMs = startMs + eventProgress * (endMs - startMs);
    const utcFrac = ((curMs % 86400000) + 86400000) % 86400000 / 86400000;
    earthSpin = (utcFrac - 0.5) * Math.PI * 2;
    moonAngle = 0.7;
    moonYOffset = 0.25;
  } else {
    // Comet modes (Encke 2027 / Halley 2061)
    const startMs = specialMode === "encke" ? Date.UTC(2027, 0, 10) : Date.UTC(2060, 11, 1);
    const endMs   = specialMode === "encke" ? Date.UTC(2027, 2, 15) : Date.UTC(2062, 1, 15);
    const curMs = startMs + eventProgress * (endMs - startMs);
    const jd = msToJD(curMs);
    const sp = sunPos(jd), mp = moonPos(jd);
    earthAngle = (sp.lon + 180) * RAD;
    moonAngle = mp.lon * RAD;
    earthSpin = -earthAngle;
  }

  const ex = Math.cos(earthAngle) * earthOrbitR;
  const ez = Math.sin(earthAngle) * earthOrbitR;
  const mx = ex + Math.cos(moonAngle) * moonOrbitR;
  const my = moonYOffset;
  const mz = ez + Math.sin(moonAngle) * moonOrbitR;

  const isExoMode = specialMode && specialMode.startsWith("exo_");
  const curJD = msToJD(simTimeMs);
  const planetPosMap = {};
  if (!activeEvent && (!specialMode || specialMode === "slingshot")) {
    for (const pl of SOLAR_PLANETS) planetPosMap[pl.id] = solveKeplerPosAU(pl, curJD);
  }

  let center = [ex, 0, ez];
  if (focusMode === "solar" || focusMode === "sun" || focusMode === "asteroid" || focusMode === "kuiper" || isExoMode) center = [0, 0, 0];
  else if (focusMode !== "earth" && planetPosMap[focusMode]) {
    const pp = planetPosMap[focusMode];
    center = [pp.x, pp.y, pp.z];
  }

  // Slingshot Probe Kinematic & Orbital Integrator
  let probeState = null;
  if (specialMode === "slingshot" && activeSlingshot) {
    activeSlingshot.elapsedDays = Math.max(0, (simTimeMs - activeSlingshot.startMs) / 86400000);
    if (activeSlingshot.elapsedDays > activeSlingshot.totalDays) {
      activeSlingshot.elapsedDays = activeSlingshot.totalDays;
    }

    let rem = activeSlingshot.elapsedDays;
    let curLeg = activeSlingshot.plan.legs[activeSlingshot.plan.legs.length - 1];
    let legT = 1.0;
    let legStartDay = 0;
    for (const leg of activeSlingshot.plan.legs) {
      if (rem <= leg.durDays) {
        curLeg = leg;
        legT = leg.durDays > 0 ? (rem / leg.durDays) : 1.0;
        break;
      }
      rem -= leg.durDays;
      legStartDay += leg.durDays;
    }

    let px = 0, py = 0, pz = 0, vx = 1, vy = 0, vz = 0, curVelKmS = 15.0;
    const legStartJD = msToJD(activeSlingshot.startMs + legStartDay * 86400000);
    const legEndJD   = msToJD(activeSlingshot.startMs + (legStartDay + curLeg.durDays) * 86400000);

    if (curLeg.type === "spiral") {
      // Spiral around Earth building momentum before Oberth escape burn
      const bPos = getBodyPosAtJD(curLeg.body, curJD);
      const turns = 3.5;
      const ang = legT * turns * Math.PI * 2;
      const rSp = bPos.r * (1.28 + legT * 1.15);
      px = bPos.x + Math.cos(ang) * rSp;
      py = bPos.y + Math.sin(ang * 0.5) * 0.12;
      pz = bPos.z + Math.sin(ang) * rSp;
      vx = -Math.sin(ang); vy = 0; vz = Math.cos(ang);
      curVelKmS = 7.8 + legT * (curLeg.vKmS - 7.8);
    } else if (curLeg.type === "flyby") {
      // Hyperbolic gravity-assist swingby curving tightly around the assist planet
      const bPos = getBodyPosAtJD(curLeg.body, curJD);
      const ang = -Math.PI * 0.75 + legT * Math.PI * 1.5;
      const rFly = bPos.r * (1.42 + Math.pow(legT - 0.5, 2) * 3.2);
      px = bPos.x + Math.cos(ang) * rFly;
      py = bPos.y + (legT - 0.5) * 0.25;
      pz = bPos.z + Math.sin(ang) * rFly;
      vx = -Math.sin(ang); vy = 0; vz = Math.cos(ang);
      curVelKmS = curLeg.vKmS;
    } else {
      // Smooth heliocentric transfer arc from departure body (at legStartJD) to arrival body (at legEndJD)
      const p0 = getBodyPosAtJD(curLeg.from, legStartJD);
      const p1 = getBodyPosAtJD(curLeg.to, legEndJD);
      const r0 = Math.hypot(p0.x, p0.z), r1 = Math.hypot(p1.x, p1.z);
      let a0 = Math.atan2(p0.z, p0.x);
      let a1 = Math.atan2(p1.z, p1.x);
      // Always travel prograde (counter-clockwise / positive angle delta)
      let dAng = a1 - a0;
      while (dAng < 0.25) dAng += Math.PI * 2;
      if (dAng > Math.PI * 2.35) dAng -= Math.PI * 2;

      const ease = legT * legT * (3 - 2 * legT);
      const rCur = r0 + (r1 - r0) * ease;
      const aCur = a0 + dAng * legT;
      px = Math.cos(aCur) * rCur;
      pz = Math.sin(aCur) * rCur;
      py = p0.y + (p1.y - p0.y) * ease;

      const aNext = aCur + 0.02;
      const rNext = r0 + (r1 - r0) * Math.min(1, ease + 0.02);
      vx = Math.cos(aNext) * rNext - px;
      vz = Math.sin(aNext) * rNext - pz;
      vy = (p1.y - p0.y) * 0.02;
      curVelKmS = curLeg.vStart + (curLeg.vEnd - curLeg.vStart) * legT;
    }

    probeState = { x: px, y: py, z: pz, vx, vy, vz, curLeg, curVelKmS, legT };
    center = [px, py, pz];
  }

  const eye = [
    center[0] + camDist * Math.cos(camPitch) * Math.sin(camYaw),
    center[1] + camDist * Math.sin(camPitch),
    center[2] + camDist * Math.cos(camPitch) * Math.cos(camYaw)
  ];

  const proj = Mat4.perspective(45 * RAD, canvas.width / canvas.height, 0.2, 4800);
  const view = Mat4.lookAt(eye, center, [0, 1, 0]);
  gl.uniformMatrix4fv(loc.uProj, false, proj);
  gl.uniformMatrix4fv(loc.uView, false, view);
  gl.uniform3f(loc.uCamPos, eye[0], eye[1], eye[2]);

  const sunDir = [-ex, 0, -ez];
  gl.uniform3f(loc.uLightDir, sunDir[0], sunDir[1], sunDir[2]);

  // 1. Starfield
  gl.uniformMatrix4fv(loc.uModel, false, Mat4.identity());
  gl.uniform1i(loc.uUseTex, 0); gl.uniform1i(loc.uIsEarth, 0); gl.uniform1i(loc.uIsSun, 0); gl.uniform1i(loc.uEclipseMode, 0);
  gl.uniform4f(loc.uColor, 0.85, 0.90, 1.0, 0.78); gl.uniform1f(loc.uUnlit, 1.0);
  gl.bindBuffer(gl.ARRAY_BUFFER, starBuf); gl.enableVertexAttribArray(loc.aPos); gl.vertexAttribPointer(loc.aPos, 3, gl.FLOAT, false, 0, 0);
  gl.disableVertexAttribArray(loc.aNorm); gl.disableVertexAttribArray(loc.aUv);
  gl.drawArrays(gl.POINTS, 0, starCount);

  // 2. Animated Boiling Plasma Sun (or Exoplanet Host Star) + Soft Volumetric Corona
  gl.uniform1f(loc.uTime, now * 0.001);
  if (isExoMode) {
    const sys = EXO_SYSTEMS[specialMode];
    const sr = sys.starR;
    drawMesh(sphereMesh, Mat4.scale(sr, sr, sr), { color: [...sys.starCol, 1.0], unlit: true });
    gl.depthMask(false);
    drawMesh(sphereMesh, Mat4.scale(sr * 1.55, sr * 1.55, sr * 1.55), { color: [...sys.coronaCol, 0.28], unlit: true });
    // Habitable Zone band rings
    drawRing(Mat4.scale(sys.hzIn * sys.scalePerAU, 1, sys.hzIn * sys.scalePerAU), [0.2, 0.85, 0.55, 0.42]);
    drawRing(Mat4.scale(sys.hzOut * sys.scalePerAU, 1, sys.hzOut * sys.scalePerAU), [0.2, 0.85, 0.55, 0.42]);
    gl.depthMask(true);

    const maxDays = specialMode === "exo_kepler186" ? 130.0 : 20.0;
    const curDay = eventProgress * maxDays;
    const exoLabels = [{ text: `${sys.name} (${sys.distLy})`, pos: [0, sr + 0.5, 0], yOff: 12, cls: "node" }];

    for (const ep of sys.planets) {
      const rUnit = ep.a * sys.scalePerAU;
      drawRing(Mat4.scale(rUnit, 1, rUnit), [0.55, 0.72, 0.95, 0.32]);
      const ang = (curDay / ep.period) * Math.PI * 2;

    const cx = rNow * Math.cos(nuNow);
    const cz0 = rNow * Math.sin(nuNow) * retro;
    const cy = cz0 * Math.sin(inc);
    const cz = cz0 * Math.cos(inc);

    // Velocity tangent for slightly curved golden dust tail
    const nuNext = nuNow + 0.04;
    const rNext = pOrb / (1 + ecc * Math.cos(nuNext));
    const vx = rNext * Math.cos(nuNext) - cx;
    const vz0 = rNext * Math.sin(nuNext) * retro - cz0;
    const vy = vz0 * Math.sin(inc);
    const vz = vz0 * Math.cos(inc);

    // Comet nucleus + glowing coma
    drawMesh(sphereMesh, Mat4.mul(Mat4.translate(cx, cy, cz), Mat4.scale(0.24, 0.24, 0.24)), { color: [0.88, 0.98, 1.0, 1.0], unlit: true });
    gl.depthMask(false);
    drawMesh(sphereMesh, Mat4.mul(Mat4.translate(cx, cy, cz), Mat4.scale(0.55, 0.55, 0.55)), { color: [0.32, 0.88, 1.0, 0.32], unlit: true });

    // Solar-wind Ion Tail ALWAYS points radially away from the Sun (direction = [cx, cy, cz])
    const tailLen = Math.max(2.5, Math.min(12.0, 68.0 / Math.max(4.5, rNow)));
    const ionModel = Mat4.alignX([cx, cy, cz], [cx, cy, cz], tailLen, 0.65);
    drawMesh(tailConeMesh, ionModel, { color: [0.22, 0.78, 1.0, 0.44], unlit: true });

    // Dust tail lags slightly behind orbital velocity vector
    const vLen = Math.hypot(vx, vy, vz) || 1;
    const rLen = Math.hypot(cx, cy, cz) || 1;
    const dustDir = [cx/rLen - (vx/vLen)*0.32, cy/rLen - (vy/vLen)*0.32, cz/rLen - (vz/vLen)*0.32];
    const dustModel = Mat4.alignX([cx, cy, cz], dustDir, tailLen * 0.78, 0.95);
    drawMesh(tailConeMesh, dustModel, { color: [1.0, 0.82, 0.45, 0.24], unlit: true });
    gl.depthMask(true);

    const cname = isHalley ? "1P/Halley (Retrograde)" : "2P/Encke";
    labels.push({ text: cname, pos: [cx, cy + 0.5, cz], yOff: 10, cls: "node" });
    labels.push({ text: "Solar Wind Ion Tail", pos: [cx + (cx/rLen)*tailLen*0.55, cy + (cy/rLen)*tailLen*0.55, cz + (cz/rLen)*tailLen*0.55], yOff: 6 });

    const startMs = isHalley ? Date.UTC(2060, 11, 1) : Date.UTC(2027, 0, 10);
    const endMs   = isHalley ? Date.UTC(2062, 1, 15) : Date.UTC(2027, 2, 15);
    const curDate = new Date(startMs + eventProgress * (endMs - startMs));
    const auDist = (rNow / 20.0 * (isHalley ? 1.85 : 1.25)).toFixed(2);
    const dateStr = watDateShort.format(curDate);
    document.getElementById("ev-live-time").textContent = `${cname} • ${dateStr}`;
    document.getElementById("ev-live-tilt").textContent = `Sun Distance: ${auDist} AU • Ion tail pushed away from Sun`;
    document.getElementById("ev-t-cur").textContent = dateStr.split(", ").slice(1).join(", ");
  }


  // 12. Render Slingshot Spacecraft, Solar Panels, Thruster Plume & Trajectory Arc
  if (probeState && activeSlingshot) {
    // Draw full multi-leg trajectory preview polyline
    const fullPts = [];
    let accD = 0;
    for (const leg of activeSlingshot.plan.legs) {
      const sJD = msToJD(activeSlingshot.startMs + accD * 86400000);
      const eJD = msToJD(activeSlingshot.startMs + (accD + leg.durDays) * 86400000);
      if (leg.type === "transfer") {
        const p0 = getBodyPosAtJD(leg.from, sJD);
        const p1 = getBodyPosAtJD(leg.to, eJD);
        const r0 = Math.hypot(p0.x, p0.z), r1 = Math.hypot(p1.x, p1.z);
        let a0 = Math.atan2(p0.z, p0.x), a1 = Math.atan2(p1.z, p1.x);
        let dAng = a1 - a0;
        while (dAng < 0.25) dAng += Math.PI * 2;
        if (dAng > Math.PI * 2.35) dAng -= Math.PI * 2;
        for (let k = 0; k <= 40; k++) {
          const t = k / 40;
          const es = t * t * (3 - 2 * t);
          const rr = r0 + (r1 - r0) * es;
          const aa = a0 + dAng * t;
          fullPts.push(Math.cos(aa) * rr, p0.y + (p1.y - p0.y) * es, Math.sin(aa) * rr);
        }
      }
      accD += leg.durDays;
    }
    if (fullPts.length >= 6) drawPolyline(fullPts, [0.22, 0.85, 0.98, 0.52]);

    // Draw Micro-Scale Spacecraft Bus + Orthogonal Solar Wings + Ion Thruster Plume
    const pPos = [probeState.x, probeState.y, probeState.z];
    const vLen = Math.hypot(probeState.vx, probeState.vy, probeState.vz) || 1;
    const vDir = [probeState.vx / vLen, probeState.vy / vLen, probeState.vz / vLen];

    // Tiny spacecraft bus (0.048 long x 0.018 radius — ~1/20th of Moon, ~1/60th of Earth)
    const bodyModel = Mat4.alignX(
      [pPos[0] - vDir[0] * 0.024, pPos[1] - vDir[1] * 0.024, pPos[2] - vDir[2] * 0.024],
      vDir, 0.048, 0.018
    );
    drawMesh(sphereMesh, bodyModel, { color: [0.96, 0.98, 1.0, 1.0], unlit: true });

    // Orthogonal solar array wings (normalized perpendicular vector so span is always exact!)
    let pxDir = -vDir[2], pyDir = 0.08, pzDir = vDir[0];
    const pDirLen = Math.hypot(pxDir, pyDir, pzDir) || 1;
    pxDir /= pDirLen; pyDir /= pDirLen; pzDir /= pDirLen;
    const wingSpan = 0.14;
    const panelModel = Mat4.alignX(
      [pPos[0] - pxDir * (wingSpan * 0.5), pPos[1] - pyDir * (wingSpan * 0.5), pPos[2] - pzDir * (wingSpan * 0.5)],
      [pxDir, pyDir, pzDir], wingSpan, 0.008
    );
    drawMesh(sphereMesh, panelModel, { color: [0.22, 0.65, 1.0, 1.0], unlit: true });

    // Crisp ion thruster plume (active during burns, subtle ion glow during cruise)
    gl.depthMask(false);
    const isBurn = (probeState.curLeg.type === "spiral" || probeState.curLeg.type === "flyby");
    const exhaustDir = [-vDir[0], -vDir[1], -vDir[2]];
    const flameLen = isBurn ? 0.16 : 0.075;
    const flameRad = isBurn ? 0.024 : 0.011;
    const flameModel = Mat4.alignX(
      [pPos[0] - vDir[0] * 0.024, pPos[1] - vDir[1] * 0.024, pPos[2] - vDir[2] * 0.024],
      exhaustDir, flameLen, flameRad
    );
    drawMesh(tailConeMesh, flameModel, {
      color: isBurn ? [0.25, 0.95, 1.0, 0.85] : [0.35, 0.82, 1.0, 0.45],
      unlit: true
    });

    // Subtle targeting reticle ring around the micro-probe so it stays easy to spot even when zoomed out
    const retR = Math.max(0.09, Math.min(0.85, camDist * 0.022));
    drawRing(Mat4.mul(Mat4.translate(pPos[0], pPos[1], pPos[2]), Mat4.scale(retR, 1, retR)), [0.22, 0.88, 1.0, 0.55]);
    gl.depthMask(true);

    const sunDistAU = Math.hypot(probeState.x, probeState.y, probeState.z) / AU_SCALE;
    const remDays = Math.max(0, Math.round(activeSlingshot.totalDays - activeSlingshot.elapsedDays));
    labels.push({
      text: `Probe (${probeState.curVelKmS.toFixed(1)} km/s • ${sunDistAU.toFixed(2)} AU)`,
      pos: [probeState.x, probeState.y + Math.max(0.08, camDist * 0.025), probeState.z], yOff: 8, cls: "node"
    });

    statusPill.innerHTML = `<strong>${probeState.curLeg.desc}</strong><br>`
      + `Speed: <strong>${probeState.curVelKmS.toFixed(1)} km/s</strong> &bull; Sun: <strong>${sunDistAU.toFixed(2)} AU</strong> &bull; ETA: <strong>${remDays}d</strong> (Tap Now to exit)`;
    statusPill.style.display = "block";
  }

  updateFloatingLabels(view, proj, labels);

  requestAnimationFrame(render);
}

requestAnimationFrame(render);
setTimeout(() => {
  if (!satCache[activeSatLayer]) fetchSatLayer(activeSatLayer, false);
}, 50);
</script>
</body>
</html>
